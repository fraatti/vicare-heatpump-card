# Weekly heat pump statistics (vicare-heatpump-card)
#
# Sampled every minute from the ViCare integration's sensors:
#  - mean supply and return water temperature during heating runs
#    (compressor on, 3-way valve on heating)
#  - mean and minimum brine temperature from and to the ground while the compressor runs
#  - average length of heating and hot water runs
#  - weekly runtime for heating, hot water and in total
# "This week" values update continuously. When the week changes (Monday 00:00),
# the finished week moves to the "last week" sensors, which are kept forever in
# Home Assistant's long-term statistics.
#
# Setup: configuration.yaml -> homeassistant: packages: !include_dir_named packages,
# copy this file to /config/packages/, check the configuration and restart.
# Generated by tools/gen_package.py (other entity IDs: comp=... valve=... sup=... ret=... bin=... bout=...).

template:
  - triggers:
      - trigger: time_pattern
        minutes: "/1"
    sensor:
      - name: "HP heating supply this week"
        unique_id: hp_heating_supply_this_week
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        state: >-
          {%- set a = this.attributes if (this is defined and this.attributes is defined) else {} -%}
          {%- set wk = now().strftime('%G-W%V') -%}
          {%- set new = (a.get('week', wk) != wk) -%}
          {%- set v = states('sensor.cu401b_g_secondary_circuit_supply_temperature') | float(none) -%}
          {%- set take = (is_state('binary_sensor.cu401b_g_compressor', 'on') and not is_state('binary_sensor.cu401b_g_dhw_charging', 'on')) and v is not none -%}
          {%- set s = (0 if new else a.get('sum', 0) | float(0)) + (v if take else 0) -%}{%- set c = (0 if new else a.get('n', 0) | int(0)) + (1 if take else 0) -%}{{ (s / c) | round(2) if c > 0 else none }}
        attributes:
          week: "{{ now().strftime('%G-W%V') }}"
          sum: >-
            {%- set a = this.attributes if (this is defined and this.attributes is defined) else {} -%}
            {%- set wk = now().strftime('%G-W%V') -%}
            {%- set new = (a.get('week', wk) != wk) -%}
            {%- set v = states('sensor.cu401b_g_secondary_circuit_supply_temperature') | float(none) -%}
            {%- set take = (is_state('binary_sensor.cu401b_g_compressor', 'on') and not is_state('binary_sensor.cu401b_g_dhw_charging', 'on')) and v is not none -%}
            {%- set s = 0 if new else a.get('sum', 0) | float(0) -%}{{ (s + (v if take else 0)) | round(2) }}
          n: >-
            {%- set a = this.attributes if (this is defined and this.attributes is defined) else {} -%}
            {%- set wk = now().strftime('%G-W%V') -%}
            {%- set new = (a.get('week', wk) != wk) -%}
            {%- set v = states('sensor.cu401b_g_secondary_circuit_supply_temperature') | float(none) -%}
            {%- set take = (is_state('binary_sensor.cu401b_g_compressor', 'on') and not is_state('binary_sensor.cu401b_g_dhw_charging', 'on')) and v is not none -%}
            {%- set c = 0 if new else a.get('n', 0) | int(0) -%}{{ c + (1 if take else 0) }}
          previous: >-
            {%- set a = this.attributes if (this is defined and this.attributes is defined) else {} -%}
            {%- set wk = now().strftime('%G-W%V') -%}
            {%- set new = (a.get('week', wk) != wk) -%}
            {%- set v = states('sensor.cu401b_g_secondary_circuit_supply_temperature') | float(none) -%}
            {%- set take = (is_state('binary_sensor.cu401b_g_compressor', 'on') and not is_state('binary_sensor.cu401b_g_dhw_charging', 'on')) and v is not none -%}
            {%- set c = a.get('n', 0) | int(0) -%}{%- if new -%}{{ ((a.get('sum', 0) | float(0)) / c) | round(2) if c > 0 else a.get('previous') }}{%- else -%}{{ a.get('previous') }}{%- endif -%}
