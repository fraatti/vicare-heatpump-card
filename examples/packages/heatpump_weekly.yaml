  - sensor:
      - name: "HP brine delta T"
        unique_id: hp_brine_delta_t
        unit_of_measurement: "K"
        state_class: measurement
        icon: mdi:thermometer-minus
        # Updated only while the compressor runs; at standstill it keeps the last running value.
        state: >-
          {% if is_state('binary_sensor.cu401b_g_compressor', 'on') and has_value('sensor.cu401b_g_primary_circuit_supply_temperature') and has_value('sensor.cu401b_g_primary_circuit_return_temperature') %}
