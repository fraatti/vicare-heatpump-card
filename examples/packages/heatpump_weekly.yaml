            {%- set c = a.get('n', 0) | int(0) -%}{%- if new -%}{{ ((a.get('sum', 0) | float(0)) / c) | round(2) if c > 0 else a.get('previous') }}{%- else -%}{{ a.get('previous') }}{%- endif -%}
