<!doctype html><html><head><meta charset="utf-8"><style>body{font-family:Roboto,Arial,sans-serif;background:#f3f3f3;margin:0;padding:16px}
:root{--card-background-color:#fff;--primary-text-color:#212121;--secondary-text-color:#727272;--primary-color:#03a9f4;--divider-color:rgba(0,0,0,.12)}
ha-card{display:block;background:var(--card-background-color);border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.2)}</style></head>
<body><script src="mock.js"></script><script src="../dist/vicare-heatpump-card.js"></script>
<div id="host" style="max-width:1240px"></div><script>
if(!customElements.get('ha-card'))customElements.define('ha-card',class extends HTMLElement{});
const q=new URLSearchParams(location.search);const cfg={type:'custom:vicare-heatpump-card',refrigerant:'R410A',hours:24,max_lift:62,
source:q.get('source')||'auto',buffer:q.get('buffer')||'no',mixer:q.get('mixer')==='1',heating_circuit:q.get('circuit')||'floor',heater:q.get('heater')==='1'?'auto':'no',
entities:{heater:'sensor.cu401b_g_heater_power',mixer:'sensor.cu401b_g_mixer_position',circ_pump_speed:'sensor.cu401b_g_circuit_pump_speed',fan:'sensor.cu401b_g_fan_speed',eev:'sensor.cu401b_g_eev_position'}};
const c=document.createElement('vicare-heatpump-card');c.setConfig(cfg);
document.getElementById('host').appendChild(c);c.hass=window.mockHass;
</script></body></html>
