<!doctype html><html><head><meta charset="utf-8"><style>body{font-family:Roboto,Arial,sans-serif;background:#f3f3f3;margin:0;padding:16px}
:root{--card-background-color:#fff;--primary-text-color:#212121;--secondary-text-color:#727272;--primary-color:#03a9f4;--divider-color:rgba(0,0,0,.12)}
ha-card{display:block;background:var(--card-background-color);border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.2)}</style></head>
<body><script src="models.js"></script><script src="mock.js"></script><script src="../dist/vicare-heatpump-card.js"></script>
<p style="margin:0 0 10px">Demo: <select id="pick"><option value="">Synthetic Vitocal 333-G (24 h history)</option></select>
<span id="src" style="color:#727272;font-size:13px"></span></p>
<div id="host" style="max-width:1240px"></div><script>
if(!customElements.get('ha-card'))customElements.define('ha-card',class extends HTMLElement{});
const q=new URLSearchParams(location.search);const cfg={type:'custom:vicare-heatpump-card',refrigerant:'R410A',hours:24,
source:q.get('source')||'auto',buffer:q.get('buffer')||'no',mixer:q.get('mixer')==='1',heating_circuit:q.get('circuit')||'floor',heater:q.get('heater')==='1'?'auto':'no',
heating_circuit_2:q.get('circuit2')||'auto',mixer_2:q.get('mixer2')==='1',circuit_name:q.get('name1')||undefined,circuit_name_2:q.get('name2')||undefined,
entities:{heater:'sensor.cu401b_g_heater_power',mixer:'sensor.cu401b_g_mixer_position',circ_pump_speed:'sensor.cu401b_g_circuit_pump_speed',fan:'sensor.cu401b_g_fan_speed',eev:'sensor.cu401b_g_eev_position',power:'sensor.cu401b_g_input_power'}};
if(q.get('circuits')==='2')Object.assign(cfg.entities,{mixer_2:'sensor.cu401b_g_mixer_position_2',circ_pump_speed_2:'sensor.cu401b_g_circuit_pump_speed_2'});
const pick=document.getElementById('pick');
for(const [id,m] of Object.entries(window.VHP_MODELS||{})){const o=document.createElement('option');o.value=id;o.textContent=m.title+' ('+m.refrigerant+')';pick.appendChild(o);}
pick.value=q.get('model')||'';pick.onchange=()=>{q.set('model',pick.value);if(!pick.value)q.delete('model');location.search=q.toString();};
if(window.mockModel){const m=window.mockModel;Object.assign(cfg,{refrigerant:m.refrigerant,source:m.source,buffer:q.get('buffer')||'auto',heater:'no',entities:m.entities});
document.getElementById('src').textContent='Snapshot of a real unit: '+m.data+'. Fan, expansion valve, internal pump and compressor speed are API values that the Home Assistant integration does not expose; here they stand in for own sensors.';}
const c=document.createElement('vicare-heatpump-card');c.setConfig(cfg);
document.getElementById('host').appendChild(c);c.hass=window.mockHass;
</script></body></html>
